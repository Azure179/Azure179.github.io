<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">黑鲷自然性逆转：甲基化与表达</title><desc id="desc">性腺阶段：精巢（T）→ 卵精巢（OT）→ 卵巢（O） → 组织学背景：阶段判定为分子比较提供依据 → 双组学平行分析：WGBS 甲基化组 + RNA-seq 转录组 → 组学内差异比较：差异甲基化区域 + 差异表达基因 → 跨组学关联：结合 DMR、基因表达与功能注释 → 生物学解释：筛选候选调控关系</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a77a42" stroke-width="1.5" /></marker></defs><rect width="1000" height="790" fill="#f4f2ed" /><path d="M42 40H958" stroke="#af8957" stroke-width="3" /><g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" fill="#242a28"><text x="50" y="82" font-size="29" font-weight="700">黑鲷自然性逆转：甲基化与表达</text><text x="50" y="112" font-size="16" fill="#676e68">BIOINFORMATICS ARCHIVE</text><rect x="50" y="140" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="186" font-size="22" fill="#9a713e">01</text><text x="130" y="171" font-size="23" font-weight="700">性腺阶段</text><text x="130" y="198" font-size="18" fill="#626b65">精巢（T）→ 卵精巢（OT）→ 卵巢（O）</text><path d="M500 218V236" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="240" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="286" font-size="22" fill="#9a713e">02</text><text x="130" y="271" font-size="23" font-weight="700">组织学背景</text><text x="130" y="298" font-size="18" fill="#626b65">阶段判定为分子比较提供依据</text><path d="M500 318V336" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="340" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="386" font-size="22" fill="#9a713e">03</text><text x="130" y="371" font-size="23" font-weight="700">双组学平行分析</text><text x="130" y="398" font-size="18" fill="#626b65">WGBS 甲基化组 + RNA-seq 转录组</text><path d="M500 418V436" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="440" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="486" font-size="22" fill="#9a713e">04</text><text x="130" y="471" font-size="23" font-weight="700">组学内差异比较</text><text x="130" y="498" font-size="18" fill="#626b65">差异甲基化区域 + 差异表达基因</text><path d="M500 518V536" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="540" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="586" font-size="22" fill="#9a713e">05</text><text x="130" y="571" font-size="23" font-weight="700">跨组学关联</text><text x="130" y="598" font-size="18" fill="#626b65">结合 DMR、基因表达与功能注释</text><path d="M500 618V636" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="640" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="686" font-size="22" fill="#9a713e">06</text><text x="130" y="671" font-size="23" font-weight="700">生物学解释</text><text x="130" y="698" font-size="18" fill="#626b65">筛选候选调控关系</text></g></svg>