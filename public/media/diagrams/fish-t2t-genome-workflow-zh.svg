<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">高体鰤参考基因组构建</title><desc id="desc">雌雄个体：分别构建独立的参考组装 → 互补测序数据：HiFi + 超长 ONT + 短读长 + Hi-C → 组装与精修：hifiasm / Verkko → 整合 → 补洞 → 抛光 → 染色体组织：Hi-C 辅助挂载与验证 → 质量评价与注释：完整性检查 → 重复序列 → 基因 → 功能 → 可复用参考资源：公开基因组组装与注释资源</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a77a42" stroke-width="1.5" /></marker></defs><rect width="1000" height="790" fill="#f4f2ed" /><path d="M42 40H958" stroke="#af8957" stroke-width="3" /><g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" fill="#242a28"><text x="50" y="82" font-size="29" font-weight="700">高体鰤参考基因组构建</text><text x="50" y="112" font-size="16" fill="#676e68">BIOINFORMATICS ARCHIVE</text><rect x="50" y="140" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="186" font-size="22" fill="#9a713e">01</text><text x="130" y="171" font-size="23" font-weight="700">雌雄个体</text><text x="130" y="198" font-size="18" fill="#626b65">分别构建独立的参考组装</text><path d="M500 218V236" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="240" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="286" font-size="22" fill="#9a713e">02</text><text x="130" y="271" font-size="23" font-weight="700">互补测序数据</text><text x="130" y="298" font-size="18" fill="#626b65">HiFi + 超长 ONT + 短读长 + Hi-C</text><path d="M500 318V336" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="340" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="386" font-size="22" fill="#9a713e">03</text><text x="130" y="371" font-size="23" font-weight="700">组装与精修</text><text x="130" y="398" font-size="18" fill="#626b65">hifiasm / Verkko → 整合 → 补洞 → 抛光</text><path d="M500 418V436" stroke="#a77a42" stroke-width="2" marker-end="url(#ar