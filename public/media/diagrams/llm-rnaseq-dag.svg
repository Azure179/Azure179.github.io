<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">One DEG result, two downstream views</title><desc id="d">DEG produces a full table for Volcano, and selected upregulated genes plus eligible background for KEGG. Both branches retain the source run.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a77a42"/></marker></defs><rect width="1000" height="450" fill="#f4f2ed"/><g font-family="Arial,sans-serif" fill="#242a28"><text x="45" y="60" font-size="30" font-weight="700">One DEG result, two downstream views</text><rect x="60" y="170" width="270" height="100" fill="#fffdf8" stroke="#b5a58c"/><text x="90" y="210" font-size="25">DESeq2 comparison</text><text x="90" y="243" font-size="19">Verified DEG result + run ID</text><path d="M330 220H440V145H565 M440 220V310H565" fill="none" stroke="#a77a42" stroke-width="3" marker-end="url(#a)"/><rect x="575" y="100" width="370" height="100" fill="#fffdf8" stroke="#b5a58c"/><text x="600" y="140" font-size="25">Volcano plot</text><text x="600" y="174" font-size="19">Full DEG table</text><rect x="575" y="260" width="370" height="100" fill="#fffdf8" stroke="#b5a58c"/><text x="600" y="300" font-size="25">KEGG over-representation</text><text x="600" y="334" font-size="18">Upregulated subset + eligible background</text></g></svg>