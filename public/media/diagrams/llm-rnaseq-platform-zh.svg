<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">受约束的 RNA-seq 分析工作区</title><desc id="desc">项目输入与研究问题：计数、元数据及用户提供的注释映射 → 受约束的 LLM 意图解析与规划：生成结构化意图与可校验计划 → 本地校验：输入、schema、依赖与来源关系 → 共享执行服务：Streamlit / FastAPI → 注册表 → 固定 Python / R 工具 → 结果持久化：表格、图形及明确的来源运行引用 → 浏览与受支持的定制：基于结果的总结、结果浏览器与衍生产物</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a77a42" stroke-width="1.5" /></marker></defs><rect width="1000" height="790" fill="#f4f2ed" /><path d="M42 40H958" stroke="#af8957" stroke-width="3" /><g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" fill="#242a28"><text x="50" y="82" font-size="29" font-weight="700">受约束的 RNA-seq 分析工作区</text><text x="50" y="112" font-size="16" fill="#676e68">BIOINFORMATICS ARCHIVE</text><rect x="50" y="140" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="186" font-size="22" fill="#9a713e">01</text><text x="130" y="171" font-size="23" font-weight="700">项目输入与研究问题</text><text x="130" y="198" font-size="18" fill="#626b65">计数、元数据及用户提供的注释映射</text><path d="M500 218V236" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="240" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="286" font-size="22" fill="#9a713e">02</text><text x="130" y="271" font-size="23" font-weight="700">受约束的 LLM 意图解析与规划</text><text x="130" y="298" font-size="18" fill="#626b65">生成结构化意图与可校验计划</text><path d="M500 318V336" stroke="#a77a42" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="340" width="900" height="78" rx="4" fill="#fffdf8" stroke="#d1c9bb" /><text x="74" y="386" font-size="22" fill="#9a713e">03</text><text x="130" y="371" font-size="23" font-weight="700">本地校验</text><text x="130" y="398" font-size="18" fill="#626b65">输入、schema、依赖与来源关系</text><path d="M500 418V436" stroke="#a77a42" stro